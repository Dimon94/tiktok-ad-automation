[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "pydantic>2.0",
    "alembic>=1.19.1,<2.0.0",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "sqlmodel>=0.0.39,<1.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.68.1,<3.0.0",
    "pyjwt<3.0.0,>=2.13.0",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "python-sdk",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.1",
    "boto3>=1.43.89",
    "mcp==2.2.0",
    "httpx2==2.12.0",
    "curl-cffi>=0.16.0,<1.0.0",
    "pillow>=12.0.0,<13.0.0",
    "ddddocr==1.6.1",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ty>=0.0.25",
    "ruff<1.0.0,>=0.2.2",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.pytest.ini_options]
# Business modules intentionally share test names such as test_admission.py.
# Resolve them by package identity rather than competing top-level module names.
addopts = ["--import-mode=importlib"]
# slow 由 tests/conftest.py 按目录和 tests/slow_tests.txt 标记；日常 `pytest -m "not slow"`。
markers = [
    "slow: 端到端验收及实测 10 秒以上的用例，只在发布门禁中运行",
    "mcp: 官方 MCP 通道专属用例；通道退役中，检查与发布门禁不运行",
]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv.sources]
python-sdk = { git = "https://github.com/tiktok/tiktok-business-api-sdk.git", subdirectory = "python_sdk", rev = "f809c396520df2d7b201a9ccc5378d822b728ed3" }
